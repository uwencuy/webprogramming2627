          cek_teks "$FILE" "border: '1px solid #dee2e6'"
          cek_teks "$FILE" "borderRadius: '6px'"
          cek_teks "$FILE" "marginBottom: '15px'"
          cek_teks "$FILE" "const textStyle = {"
          cek_teks "$FILE" "fontWeight: 'bold'"
          cek_teks "$FILE" "color: '#0d6efd'"
          cek_teks "$FILE" "return ("
          cek_teks "$FILE" "<div style={cardStyle}>"
          cek_teks "$FILE" "<p style={textStyle}>Total Saldo: Rp 2.500.000</p>"

          # Cara menggunakannya 
        

